# Supporting services for the ToolHive demo. The MCP servers themselves are
# started by `thv` (see demo.sh), not by compose.
name: toolhive-demo

services:
  # Identity provider: issues the JWTs that ToolHive validates.
  keycloak:
    image: keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens must carry iss=http://localhost:8080/realms/toolhive-demo,
      # the exact URL ToolHive is configured with.
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Policy Decision Point: answers ToolHive's authorization questions with Cedar.
  pdp:
    build: ./pdp
    image: toolhive-demo-pdp:local
    user: "0:0"   # write the decision log into the bind-mounted .state dir
    environment:
      PDP_ADDR: ":9000"
      PDP_POLICY_DIR: /policies
      PDP_DECISION_LOG: /state/decisions.jsonl
      PDP_DISPLAY_NAMES: /config/display-names.json
    ports:
      - "9191:9000"
    volumes:
      - ./policies:/policies:ro
      - ./config/display-names.json:/config/display-names.json:ro
      - ./.state:/state
    tty: true     # keep colours in `docker compose logs`

  # Trace backend: ToolHive exports one OpenTelemetry span per MCP request.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  # Pretend attacker. Anything printed here is a leak.
  attacker:
    image: python:3.12-alpine
    command: ["python", "-u", "/app/listener.py"]
    ports:
      - "9999:9999"
    volumes:
      - ./attacker/listener.py:/app/listener.py:ro
    tty: true
